[package]
name = "file-organizer"
version = "0.1.0"
edition = "2021"
description = "Cross-platform configurable file organizer"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
