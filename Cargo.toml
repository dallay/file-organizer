[package]
name = "organiza"
version = "0.2.0"
edition = "2021"
description = "Cross-platform configurable file organizer"
license = "MIT"
repository = "https://github.com/dallay/file-organizer"
readme = "README.md"
keywords = ["files", "organizer", "cli", "organization", "cleanup"]
categories = ["command-line-utilities", "filesystem"]
authors = ["Yuniel Acosta <yunielacosta738@gmail.com>"]
exclude = [
    ".agents",
    ".github",
    "npm",
    "openspec",
    "platform",
    "scripts",
    ".dockerignore",
    ".gitignore",
    ".release-please-manifest.json",
    "Dockerfile",
    "config.example.toml",
    "release-please-config.json",
]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
